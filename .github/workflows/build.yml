name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: cargo build --release
      - name: Guardar o exe
        uses: actions/upload-artifact@v4
        with:
          name: configurar-atalho
          path: target/release/configurar-atalho.exe
